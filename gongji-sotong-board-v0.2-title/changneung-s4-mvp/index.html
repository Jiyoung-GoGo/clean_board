<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>공지소통게시판</title>
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
<style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#27343b;background:#f5f7f7}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}.wrap{max-width:920px;margin:auto;padding:44px 18px 90px}header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:32px}h1{font-size:27px;letter-spacing:-1px;margin:0 0 6px}header p{color:#7b898d;margin:0;font-size:14px}.panel{background:#fff;border:1px solid #e4e9e9;border-radius:13px;box-shadow:0 4px 18px #233f4610}.toolbar{display:flex;gap:10px;margin-bottom:16px}input,textarea{width:100%;border:1px solid #dae2e2;border-radius:8px;padding:12px;outline:none;background:#fff;color:#27343b}input:focus,textarea:focus{border-color:#577d7c}textarea{min-height:130px;resize:vertical}button{border:1px solid #d8e0e0;background:#fff;color:#3d5659;border-radius:8px;padding:10px 15px;white-space:nowrap}button:hover{background:#f2f6f6}.primary{background:#476e70;border-color:#476e70;color:#fff}.primary:hover{background:#37595a}.small{padding:6px 10px;font-size:12px}.listhead{padding:17px 22px;color:#64777b;font-size:13px;border-bottom:1px solid #eaf0f0}.item{border-bottom:1px solid #edf0f0}.item:last-child{border-bottom:0}.qline{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:18px 22px;border:0;border-radius:0;white-space:normal;background:transparent}.qline:hover{background:#f8fbfa}.qtitle{flex:1;font-weight:600;overflow-wrap:anywhere}.count{color:#4b7778;font-weight:600}.meta{font-size:12px;color:#98a5a7}.pin{font-size:11px;color:#547477;background:#e9f1f0;padding:4px 7px;border-radius:5px}.details{padding:0 22px 20px;background:#fafcfc}.body{padding:16px 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.8}.actions{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 18px}.answers{border-top:1px solid #e5ebeb;padding-top:14px}.answers h3{font-size:14px;margin:0 0 12px;color:#536e70}.answer{border:1px solid #e5eceb;border-radius:8px;margin-bottom:10px;padding:14px;background:#fff}.answer .body{padding:5px 0 10px}.answerbottom{display:flex;justify-content:space-between;align-items:center;gap:8px}.empty{padding:56px 20px;text-align:center;color:#8c9a9c}.hidden{display:none!important}.status{padding:12px 3px;color:#5f797c;font-size:13px;min-height:20px}dialog{border:1px solid #e1e8e8;border-radius:14px;padding:24px;width:min(510px,calc(100vw - 28px));box-shadow:0 16px 60px #10252b30}dialog::backdrop{background:#182b3090}dialog h2{margin:0 0 18px;font-size:19px}label{display:block;font-size:13px;font-weight:600;margin:16px 0 7px}dialog footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.adminbar{margin:0 0 14px;display:flex;align-items:center;justify-content:flex-end;gap:8px;font-size:13px;color:#587575}@media(max-width:620px){.wrap{padding-top:25px}h1{font-size:23px}.toolbar{flex-wrap:wrap}.toolbar input{flex-basis:100%}.toolbar button{flex:1}.meta{display:none}.qline{padding:16px}.details{padding:0 16px 16px}}
.gate{max-width:420px;margin:12vh auto 0;padding:30px}.gate h2{font-size:22px;margin:0 0 8px}.gate p{font-size:13px;color:#75868b;line-height:1.7}.gate form{display:flex;flex-direction:column;gap:12px;margin-top:20px}.gate form label{margin:0}.gate .primary{width:100%}
</style></head><body>
<section id="gate" class="panel gate" aria-label="게시판 입장"><h2>공지소통게시판</h2><p>게시판을 보려면 입장 비밀번호를 입력해 주세요.</p><form id="gateForm"><label for="entryPw">입장 비밀번호</label><input id="entryPw" type="password" autocomplete="off" required><button type="submit" class="primary">입장하기</button></form><div id="gateStatus" class="status" role="status"></div></section>
<main id="board" class="wrap hidden">
<header><div><h1>공지소통게시판</h1><p>궁금한 내용을 검색하고, 질문과 답변을 확인하세요.</p></div><div style="display:flex;gap:6px"><button id="adminBtn" class="small">관리자모드</button><button id="leaveBtn" class="small">퇴장</button></div></header>
<div id="adminBar" class="adminbar hidden"><span>관리자모드 사용 중</span><button id="adminOff" class="small">종료</button></div>
<section class="toolbar" aria-label="질문 검색과 등록"><input id="search" placeholder="질문 제목이나 내용을 검색하세요" aria-label="질문 검색"><button id="searchBtn">검색</button><button id="newBtn" class="primary">질문 등록</button></section>
<section class="panel"><div id="listHead" class="listhead">질문 목록</div><div id="list"><div class="empty">질문을 불러오는 중입니다.</div></div></section><div id="status" class="status" role="status"></div>
</main>
<dialog id="editDialog"><form id="editForm"><h2 id="editHeading">질문 등록</h2><div id="titleArea"><label for="title">질문 제목</label><input id="title" maxlength="120"></div><label for="body">내용</label><textarea id="body" maxlength="5000" required></textarea><label for="pw">작성 비밀번호 <span id="pwHint" style="color:#829093;font-weight:400">(8자 이상, 수정·삭제 시 필요)</span></label><input id="pw" type="password" autocomplete="new-password"><footer><button type="button" data-close="editDialog">취소</button><button id="saveBtn" type="submit" class="primary">저장</button></footer></form></dialog>
<dialog id="authDialog"><form id="authForm"><h2 id="authHeading">비밀번호 확인</h2><label for="authPw">비밀번호</label><input id="authPw" type="password" required autocomplete="off"><footer><button type="button" data-close="authDialog">취소</button><button id="authSubmit" type="submit" class="primary">확인</button></footer></form></dialog>
<script>
// 아래 두 값만 Supabase 대시보드의 Project URL / Publishable key(또는 anon key)로 교체
const SUPABASE_URL = 'YOUR_SUPABASE_PROJECT_URL';
const SUPABASE_KEY = 'YOUR_SUPABASE_PUBLISHABLE_KEY';
const $ = id => document.getElementById(id);
let rows=[],opened=null,thread=null,adminPassword=null,entryToken=null,editing=null,authAction=null,busy=false;
const configured=()=>SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('YOUR_')&&!SUPABASE_KEY.includes('YOUR_');
const date=s=>new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(s));
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function say(message){$('status').textContent=message}
function errorMessage(e){return e?.message||'요청을 처리하지 못했습니다.'}
async function rpc(name,params={}){if(!configured())throw Error('index.html에 Supabase URL과 Publishable key를 설정하세요.');
 const resp=await fetch(`${SUPABASE_URL.replace(/\/$/,'')}/rest/v1/rpc/${name}`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`},body:JSON.stringify(name==='board_enter'?params:{...params,p_token:entryToken})});
 const result=await resp.json().catch(()=>null);if(!resp.ok)throw Error(result?.message||`서버 오류 (${resp.status})`);return result;
}
async function run(work){if(busy)return;busy=true;try{await work()}catch(e){say(errorMessage(e));alert(errorMessage(e))}finally{busy=false}}
async function load(){rows=await rpc('board_list',{p_search:$('search').value.trim()});$('listHead').textContent=`질문 목록 · ${rows.length}건${rows.length===200?' (최대 200건 표시)':''}`;render()}
function render(){const root=$('list');root.replaceChildren();if(!rows.length){root.append(el('div','empty','등록된 질문이 없거나 검색 결과가 없습니다.'));return}
for(const r of rows){const item=el('article','item');const line=el('button','qline');line.type='button';line.setAttribute('aria-expanded',String(opened===r.id));
if(r.pinned)line.append(el('span','pin','상단 고정'));line.append(el('span','qtitle',r.title));line.append(el('span','count',`(${r.answer_count})`));line.append(el('span','meta',`조회 ${r.views} · ${date(r.created_at)}`));
line.addEventListener('click',()=>run(async()=>{if(opened===r.id){opened=null;thread=null;render();return}thread=await rpc('board_open',{p_id:r.id});opened=r.id;await load()}));item.append(line);
if(opened===r.id&&thread?.question?.id===r.id){const d=el('div','details');d.append(el('div','body',thread.question.body));const tools=el('div','actions');addBtn(tools,'수정',()=>edit('question',thread.question));addBtn(tools,'삭제',()=>remove(thread.question));if(adminPassword){addBtn(tools,r.pinned?'고정 해제':'상단 고정',()=>run(async()=>{await rpc('board_pin',{p_id:r.id,p_pin:!r.pinned,p_admin_password:adminPassword});say('상단 고정 상태가 변경되었습니다.');await load()}))}d.append(tools);
const ans=el('div','answers');ans.append(el('h3','',`답변 (${thread.answers.length})`));for(const a of thread.answers){const box=el('div','answer');box.append(el('div','body',a.body));const bottom=el('div','answerbottom');bottom.append(el('span','meta',date(a.created_at)));const ops=el('div','actions');ops.style.padding='0';addBtn(ops,'수정',()=>edit('answer',a));addBtn(ops,'삭제',()=>remove(a));bottom.append(ops);box.append(bottom);ans.append(box)}addBtn(ans,'답변 등록',()=>edit('answer',null,r.id),'primary');d.append(ans);item.append(d)}root.append(item)} }
function addBtn(host,label,cb,cls=''){const b=el('button',`small ${cls}`,label);b.type='button';b.addEventListener('click',cb);host.append(b)}
function edit(kind,post=null,parentId=null){editing={kind,id:post?.id??null,parentId};$('editHeading').textContent=`${kind==='question'?'질문':'답변'} ${post?'수정':'등록'}`;$('titleArea').classList.toggle('hidden',kind==='answer');$('title').value=post?.title||'';$('body').value=post?.body||'';$('pw').value='';$('pw').required=!adminPassword||!post;$('pwHint').textContent=post?(adminPassword?'(관리자는 입력 불필요)':'(작성 당시 비밀번호)'):'(8자 이상, 수정·삭제 시 필요)';$('editDialog').showModal()}
async function refreshOpen(){if(opened!==null){try{thread=await rpc('board_open',{p_id:opened})}catch{opened=null;thread=null}}await load()}
$('editForm').addEventListener('submit',e=>{e.preventDefault();run(async()=>{const pw=$('pw').value;const id=editing.id;await rpc('board_save',{p_id:id,p_parent_id:editing.parentId,p_title:editing.kind==='question'?$('title').value:null,p_body:$('body').value,p_password:pw||null,p_admin_password:adminPassword});$('editDialog').close();say(id?'수정되었습니다.':'등록되었습니다.');await refreshOpen()})});
function requestPassword(heading,fn){authAction=fn;$('authHeading').textContent=heading;$('authPw').value='';$('authDialog').showModal()}
$('authForm').addEventListener('submit',e=>{e.preventDefault();run(async()=>{const password=$('authPw').value;await authAction(password);$('authDialog').close()})});
function remove(post){if(!confirm('삭제한 글은 복구할 수 없습니다. 삭제하시겠습니까?'))return;
const action=async password=>{await rpc('board_delete',{p_id:post.id,p_password:password,p_admin_password:adminPassword});if(post.id===opened){opened=null;thread=null}say('삭제되었습니다.');await refreshOpen()};
if(adminPassword)run(()=>action(null));else requestPassword('삭제할 게시글의 비밀번호',action)}
$('adminBtn').addEventListener('click',()=>requestPassword('관리자 비밀번호',async password=>{if(!await rpc('board_admin_check',{p_password:password}))throw Error('관리자 비밀번호가 올바르지 않습니다.');adminPassword=password;$('adminBar').classList.remove('hidden');$('adminBtn').classList.add('hidden');say('관리자모드가 활성화되었습니다.');render()}));
$('adminOff').addEventListener('click',()=>{adminPassword=null;$('adminBar').classList.add('hidden');$('adminBtn').classList.remove('hidden');say('관리자모드를 종료했습니다.');render()});
$('newBtn').addEventListener('click',()=>edit('question'));
$('searchBtn').addEventListener('click',()=>run(async()=>{opened=null;thread=null;await load()}));
$('search').addEventListener('keydown',e=>{if(e.key==='Enter')$('searchBtn').click()});
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>$(b.dataset.close).close()));
$('gateForm').addEventListener('submit',e=>{e.preventDefault();run(async()=>{try{entryToken=await rpc('board_enter',{p_password:$('entryPw').value});$('entryPw').value='';$('gateStatus').textContent='';$('gate').classList.add('hidden');$('board').classList.remove('hidden');await load()}catch(error){entryToken=null;$('gateStatus').textContent=errorMessage(error);throw error}})});
$('leaveBtn').addEventListener('click',()=>run(async()=>{if(entryToken){try{await rpc('board_leave')}catch(e){console.warn('퇴장 처리 실패:',e.message)}}entryToken=null;adminPassword=null;rows=[];opened=null;thread=null;$('search').value='';$('adminBar').classList.add('hidden');$('adminBtn').classList.remove('hidden');$('board').classList.add('hidden');$('gate').classList.remove('hidden');say('')}));
if(!configured())$('gateStatus').textContent='설정 필요: index.html에 Supabase URL과 Publishable key를 입력하세요.';
</script></body></html>
